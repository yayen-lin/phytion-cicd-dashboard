spring.application.name=dashboard

# load env secrets
spring.config.import=optional:file:.env[.properties]

######################################################### ci #########################################################
# jenkins
dashboard.jenkins.url=${JENKINS_URL:}
dashboard.jenkins.user=${JENKINS_USER:}
dashboard.jenkins.token=${JENKINS_TOKEN:}
dashboard.jenkins.max-builds=20
dashboard.jenkins.queue-poll-interval=1s
dashboard.jenkins.queue-timeout=30s

##################################################### code source #####################################################
# bitbucket
dashboard.bitbucket.url=https://api.bitbucket.org/2.0
dashboard.bitbucket.web-url=https://bitbucket.org
dashboard.bitbucket.max-branches=50
dashboard.bitbucket.max-commits=20

####################################################### release #######################################################
# docker registry (jenkins/docker-compose.yml)
dashboard.docker-registry.url=http://localhost:5001
dashboard.docker-registry.max-versions=20

######################################################## deploy ########################################################
dashboard.environments=dev,staging,prod

####################################################### operate #######################################################
# kubernetes
dashboard.kubernetes.url=${KUBERNETES_URL:}
dashboard.kubernetes.token=${KUBERNETES_TOKEN:}
dashboard.kubernetes.ca-data=${KUBERNETES_CA_DATA:}

######################################################### apps #########################################################

# sample-app
dashboard.apps.sample-app.repo.tool=bitbucket
dashboard.apps.sample-app.repo.workspace=andy-test-app
dashboard.apps.sample-app.repo.name=sample-app
dashboard.apps.sample-app.repo.token=${BITBUCKET_SAMPLE_APP_TOKEN:}
dashboard.apps.sample-app.pipeline.tool=jenkins
dashboard.apps.sample-app.pipeline.job=sample-app
dashboard.apps.sample-app.release.tool=docker-registry
dashboard.apps.sample-app.release.image=sample-app
dashboard.apps.sample-app.deploy.tool=jenkins
dashboard.apps.sample-app.deploy.job=sample-app-deploy

# dummy-app
dashboard.apps.dummy-app.repo.tool=bitbucket
dashboard.apps.dummy-app.repo.workspace=andy-test-app
dashboard.apps.dummy-app.repo.name=dummy-app
dashboard.apps.dummy-app.repo.token=${BITBUCKET_DUMMY_APP_TOKEN:}
dashboard.apps.dummy-app.pipeline.tool=jenkins
dashboard.apps.dummy-app.pipeline.job=dummy-app
dashboard.apps.dummy-app.release.tool=docker-registry
dashboard.apps.dummy-app.release.image=dummy-app
dashboard.apps.dummy-app.deploy.tool=jenkins
dashboard.apps.dummy-app.deploy.job=dummy-app-deploy

########################################################## db ##########################################################
spring.datasource.url=jdbc:h2:file:./data/dashboard
spring.jpa.hibernate.ddl-auto=validate

# audit log
dashboard.audit.max-entries=50
dashboard.audit.details-max-length=1000

