spring.application.name=dashboard

# load env secrets
spring.config.import=optional:file:.env[.properties]

######################################################### ci #########################################################
# jenkins
dashboard.jenkins.url=${JENKINS_URL:}
dashboard.jenkins.user=${JENKINS_USER:}
dashboard.jenkins.token=${JENKINS_TOKEN:}
dashboard.jenkins.max-builds=20
dashboard.jenkins.queue-poll-interval=1s
dashboard.jenkins.queue-timeout=30s

# pipeline for app 1
dashboard.ci.pipelines[0].tool=jenkins
dashboard.ci.pipelines[0].job=sample-app

# pipeline for app 2
dashboard.ci.pipelines[1].tool=jenkins
dashboard.ci.pipelines[1].job=dummy-app

##################################################### code source #####################################################
# bitbucket
dashboard.bitbucket.url=https://api.bitbucket.org/2.0
dashboard.bitbucket.web-url=https://bitbucket.org
dashboard.bitbucket.max-branches=50
dashboard.bitbucket.max-commits=20

# repo for app 1
dashboard.code.repos[0].tool=bitbucket
dashboard.code.repos[0].workspace=andy-test-app
dashboard.code.repos[0].name=sample-app
dashboard.code.repos[0].token=${BITBUCKET_SAMPLE_APP_TOKEN:}

# repo for app 2
dashboard.code.repos[1].tool=bitbucket
dashboard.code.repos[1].workspace=andy-test-app
dashboard.code.repos[1].name=dummy-app
dashboard.code.repos[1].token=${BITBUCKET_DUMMY_APP_TOKEN:}

####################################################### release #######################################################
# docker registry (jenkins/docker-compose.yml)
dashboard.registry.url=http://localhost:5001
dashboard.registry.max-versions=20

# app 1
dashboard.release.apps[0].tool=registry
dashboard.release.apps[0].image=sample-app
dashboard.release.apps[0].pipeline=jenkins:sample-app
dashboard.release.apps[0].repo=bitbucket:andy-test-app/sample-app

# app 2
dashboard.release.apps[1].tool=registry
dashboard.release.apps[1].image=dummy-app
dashboard.release.apps[1].pipeline=jenkins:dummy-app
dashboard.release.apps[1].repo=bitbucket:andy-test-app/dummy-app

###################################################### audit log ######################################################
dashboard.audit.max-entries=50
dashboard.audit.details-max-length=1000
spring.datasource.url=jdbc:h2:file:./data/dashboard
spring.jpa.hibernate.ddl-auto=validate

