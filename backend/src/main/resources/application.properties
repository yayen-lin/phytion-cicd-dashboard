spring.application.name=dashboard

# load env secrets
spring.config.import=optional:file:.env[.properties]

######################################################### ci #########################################################
dashboard.ci.pipelines[0].tool=jenkins
dashboard.ci.pipelines[0].job=sample-app
dashboard.ci.pipelines[1].tool=jenkins
dashboard.ci.pipelines[1].job=dummy-app

# jenkins
dashboard.jenkins.url=${JENKINS_URL:}
dashboard.jenkins.user=${JENKINS_USER:}
dashboard.jenkins.token=${JENKINS_TOKEN:}
dashboard.jenkins.max-builds=20
dashboard.jenkins.queue-poll-interval=1s
dashboard.jenkins.queue-timeout=30s

##################################################### code source #####################################################
dashboard.code.repos[0].tool=bitbucket
dashboard.code.repos[0].repo=andy-test-app/sample-app
dashboard.code.repos[1].tool=bitbucket
dashboard.code.repos[1].repo=andy-test-app/dummy-app

# bitbucket
dashboard.bitbucket.url=https://api.bitbucket.org/2.0
dashboard.bitbucket.max-branches=50
dashboard.bitbucket.max-commits=20


###################################################### audit log ######################################################
dashboard.audit.max-entries=50
spring.datasource.url=jdbc:h2:file:./data/dashboard
spring.jpa.hibernate.ddl-auto=validate

