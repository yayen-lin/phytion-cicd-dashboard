spring.application.name=dashboard

# load env secrets
spring.config.import=optional:file:.env[.properties]

# The CI jobs the dashboard shows (tool + job), listed in this order in the pipeline selector.
# Only the "jenkins" tool has an adapter so far.
dashboard.ci.pipelines[0].tool=jenkins
dashboard.ci.pipelines[0].job=sample-app

# How many recent audit log entries to show
dashboard.audit.max-entries=50

# Jenkins
dashboard.jenkins.url=${JENKINS_URL:}
dashboard.jenkins.user=${JENKINS_USER:}
dashboard.jenkins.token=${JENKINS_TOKEN:}
dashboard.jenkins.max-builds=20
dashboard.jenkins.queue-poll-interval=1s
dashboard.jenkins.queue-timeout=30s

# Database for the action history: stored in backend/data/
spring.datasource.url=jdbc:h2:file:./data/dashboard
# Flyway creates and changes the tables (src/main/resources/db/migration); Hibernate only checks they match
spring.jpa.hibernate.ddl-auto=validate
