services:
  jenkins:
    build: .                 # jenkins/jenkins plus the Docker CLI, see Dockerfile
    image: phytion-jenkins
    container_name: jenkins
    ports:
      - "8081:8080"
    volumes:
      - jenkins_home:/var/jenkins_home # keeps jobs, plugins and users when the container restarts
      # Docker Desktop's engine, so pipelines can build images. The socket belongs to group 0 (root)
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "0"

  # Where the Release stage pushes images to
  registry:
    image: registry:2.8.3
    container_name: registry
    ports:
      - "5001:5000" # 5001 because macOS' AirPlay Receiver takes 5000
    volumes:
      - registry_data:/var/lib/registry # keeps the images when the container restarts

  # The dashboard's database
  postgres:
    image: postgres:17.6
    container_name: postgres
    ports:
      - "5432:5432"
    env_file: ../backend/.env
    environment:
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  jenkins_home:
  registry_data:
  postgres_data:
