# The identity the dashboard's backend uses to read what runs in each environment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dashboard-reader
  namespace: default
---
# a long-lived token for the service account, read into backend/.env as KUBERNETES_TOKEN
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-reader-token
  namespace: default
  annotations:
    kubernetes.io/service-account.name: dashboard-reader
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-reader
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: dashboard-reader
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-reader
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: dashboard-reader
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dashboard-reader
  namespace: prod
subjects:
  - kind: ServiceAccount
    name: dashboard-reader
    namespace: default
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
